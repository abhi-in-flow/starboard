[package]
name = "starboard"
version = "0.1.0"
description = "Local-first GitHub stars organizer"
authors = ["Abhilash"]
edition = "2021"

[lib]
name = "starboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2"
rusqlite = { version = "0.32", features = ["bundled", "backup"] }
rusqlite_migration = "1.3"
sqlite-vec = "0.1.6"
sha2 = "0.10"
keyring = { version = "3", features = ["windows-native", "apple-native", "linux-native"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
regex = "1"
log = "0.4"
base64 = "0.22.1"
rand = "0.8"
time = { version = "0.3.53", features = ["formatting", "parsing"] }
futures = { version = "0.3.32", features = ["std"] }
tauri-plugin-dialog = "2"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros"] }
wiremock = "0.6.5"
